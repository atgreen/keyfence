name: Release

on:
  push:
    tags: ['v*']
  # An RPM without a release: run this by hand and take the artifact. Only a tag
  # push publishes anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # The version, once, for everything downstream.
  # ------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            spec=$(awk '/^Version:/ {print $2}' releng/keyfence.spec)
            if [ "${version}" != "${spec}" ]; then
              echo "tag version ${version} does not match spec version ${spec}" >&2
              exit 1
            fi
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # Not a release: version from the spec, with the commit after it, so
            # an artifact built by hand is never mistaken for a published one.
            spec=$(awk '/^Version:/ {print $2}' releng/keyfence.spec)
            echo "version=${spec}^$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # Binaries for people who would rather not use a package.
  # ------------------------------------------------------------------
  binaries:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p dist
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.buildDate=${BUILD_DATE}"
          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
                go build -trimpath -buildvcs=false -ldflags="${LDFLAGS}" \
                -o "dist/keyfence-${GOOS}-${GOARCH}" ./cmd/keyfence
            done
          done
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -buildvcs=false -ldflags="${LDFLAGS}" \
            -o dist/keyfence-windows-amd64.exe ./cmd/keyfence

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

  # ------------------------------------------------------------------
  # The RPM, built and signed in an EL container.
  #
  # x86_64 only. Go cross-compiles happily, but an arm64 RPM means teaching
  # rpmbuild to target it as well, and the release already carries an arm64
  # binary for anyone who needs one.
  # ------------------------------------------------------------------
  rpm:
    needs: version
    runs-on: ubuntu-latest
    container:
      image: almalinux:9
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KEYFENCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Install build tools
        run: |
          dnf install -y rpm-build rpmdevtools rpm-sign gcc git tar gzip which

      - uses: actions/checkout@v4

      - name: Install Go
        run: |
          # From upstream rather than the distribution: go.mod asks for a newer
          # Go than EL9 packages. This is why rpmbuild runs with --nodeps below;
          # the spec's BuildRequires still documents what a normal build needs.
          GO_VERSION=$(grep -E '^go [0-9]' go.mod 2>/dev/null | awk '{print $2}' || echo 1.25.0)
          curl -sSLo /tmp/go.tar.gz "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" \
            || curl -sSLo /tmp/go.tar.gz "https://go.dev/dl/go1.25.0.linux-amd64.tar.gz"
          tar -C /usr/local -xzf /tmp/go.tar.gz
          ln -sf /usr/local/go/bin/go /usr/bin/go
          go version

      - name: Build the RPM
        run: |
          rpmdev-setuptree
          sed -i "s/^Version:.*/Version:        ${VERSION}/" releng/keyfence.spec
          mkdir -p "/tmp/src/keyfence-${VERSION}"
          tar --exclude=.git --exclude=bin -cf - . | tar -xf - -C "/tmp/src/keyfence-${VERSION}"
          tar -czf "$HOME/rpmbuild/SOURCES/keyfence-${VERSION}.tar.gz" \
            -C /tmp/src "keyfence-${VERSION}"
          cp releng/keyfence.spec "$HOME/rpmbuild/SPECS/"
          rpmbuild --nodeps -bb "$HOME/rpmbuild/SPECS/keyfence.spec"
          mkdir -p dist
          cp "$HOME"/rpmbuild/RPMS/*/*.rpm dist/

      - name: Sign the RPM
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        if: ${{ env.RPM_GPG_PRIVATE_KEY != '' }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          echo "${RPM_GPG_PRIVATE_KEY}" | base64 -d | gpg --batch --import
          GPG_NAME=$(gpg --list-secret-keys --with-colons | awk -F: '/^uid/{print $10; exit}')
          printf '%%_signature gpg\n%%_gpg_name %s\n' "${GPG_NAME}" > ~/.rpmmacros
          rpm --addsign dist/*.rpm
          rpm --checksig dist/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  # ------------------------------------------------------------------
  # The release itself.
  # ------------------------------------------------------------------
  release:
    needs: [version, binaries, rpm]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: rpm
          path: dist

      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt

      - name: Extract release notes from changelog
        run: |
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/keyfence-*
            dist/*.rpm
            dist/checksums.txt

  # ------------------------------------------------------------------
  # Repository metadata, pointing at the release's own assets, so that
  # "dnf install keyfence" works without hosting the packages twice.
  # ------------------------------------------------------------------
  rpm-repo:
    needs: [version, release]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install createrepo_c
        run: sudo apt-get update && sudo apt-get install -y createrepo-c

      - name: Collect the release's RPMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/rpms
          gh release download "${TAG}" --pattern '*.rpm' --dir /tmp/rpms --skip-existing
          ls -lh /tmp/rpms

      - name: Build repodata
        # Gzip explicitly: createrepo_c 1.2 and later default to zstd, and the
        # rewriting below has to know what it is looking for. Gzip is also what
        # every dnf and yum in service can read without argument.
        run: createrepo_c --general-compress-type=gz /tmp/rpms

      - name: Point package locations at the release assets
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          cd /tmp/rpms/repodata
          gunzip -f ./*-primary.xml.gz
          PRIMARY=$(ls ./*-primary.xml)
          sed -i "s|<location href=\"\([^\"]*\.rpm\)\"|<location href=\"${BASE}/\1\"|g" "${PRIMARY}"
          gzip -9 "${PRIMARY}"

          # repomd.xml has to be rebuilt because its checksums now describe
          # files that have been rewritten.
          cd /tmp/rpms
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<repomd xmlns="http://linux.duke.edu/metadata/repo">\n' \
            > repodata/repomd.xml
          for gz in repodata/*.xml.gz; do
            fname=$(basename "${gz}")
            type=$(echo "${fname}" | sed 's/.*-\([a-z_]*\)\.xml\.gz/\1/')
            checksum=$(sha256sum "${gz}" | awk '{print $1}')
            size=$(stat -c%s "${gz}")
            gunzip -k -f "${gz}"
            open_checksum=$(sha256sum "${gz%.gz}" | awk '{print $1}')
            open_size=$(stat -c%s "${gz%.gz}")
            rm -f "${gz%.gz}"
            printf '  <data type="%s">\n' "${type}" >> repodata/repomd.xml
            printf '    <checksum type="sha256">%s</checksum>\n' "${checksum}" >> repodata/repomd.xml
            printf '    <open-checksum type="sha256">%s</open-checksum>\n' "${open_checksum}" >> repodata/repomd.xml
            printf '    <location href="repodata/%s"/>\n' "${fname}" >> repodata/repomd.xml
            printf '    <size>%s</size>\n' "${size}" >> repodata/repomd.xml
            printf '    <open-size>%s</open-size>\n' "${open_size}" >> repodata/repomd.xml
            printf '  </data>\n' >> repodata/repomd.xml
          done
          echo '</repomd>' >> repodata/repomd.xml

      - name: Sign the metadata and export the public key
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        if: ${{ env.RPM_GPG_PRIVATE_KEY != '' }}
        run: |
          echo "${RPM_GPG_PRIVATE_KEY}" | base64 -d | gpg --batch --import
          gpg --batch --detach-sign --armor /tmp/rpms/repodata/repomd.xml
          gpg --batch --export --armor > /tmp/rpms/RPM-GPG-KEY-keyfence

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-repo
          path: |
            /tmp/rpms/repodata/
            /tmp/rpms/RPM-GPG-KEY-keyfence

  pages:
    needs: [version, rpm-repo]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rpm-repo
          path: docs/rpm-repo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - id: deployment
        uses: actions/deploy-pages@v4
